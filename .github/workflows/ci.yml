name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        # rust-toolchain.toml pins Rust 1.97.1 and clippy/rustfmt/llvm-tools.
        run: rustup show

      - name: Install test and ingress build tools
        # firecrab-helper's dhcp.rs tests shell out to the real
        # `dnsmasq --test` to validate generated configs, and oci::ext4's
        # tests pack a root-owned image via real `fakeroot` (issue #250) —
        # neither preinstalled on the runner image.
        run: sudo apt-get update && sudo apt-get install -y dnsmasq fakeroot musl-tools iproute2

      - name: Build private ingress engine
        run: |
          ./scripts/build-ingress.sh target/ingress
          ./scripts/build-guest-console.sh target/ingress
          python3 scripts/test-guest-console.py
          python3 scripts/test-workspace-files.py
          sudo python3 scripts/test-sandbox-user.py
          python3 scripts/test-guest-app-log.py

      - name: Verify bundled ingress installation
        run: sudo bash scripts/test-ingress-install.sh target/ingress

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # -D warnings: one warning fails the build, with no baseline to drift.
        # The dead_code that used to make this impossible is gone — items that
        # only tests use are #[cfg(test)], and the rest was deleted.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test -p firecrab-cli
        run: cargo test -p firecrab-cli --locked

      - name: Validate the example stack offline
        run: cargo run -p firecrab-cli --locked -- stack validate --file examples/stacks/basic.yaml --json

      - name: IaC v0.4.0 service inventory
        run: python3 scripts/check-iac-inventory.py

      - name: Shared source development deployment contract
        run: python3 scripts/test-micromanager-dev.py

      - name: Managed update regression checks
        run: python3 scripts/test-micromanager-update.py

      - name: Guest QA failure and cleanup contract
        run: |
          python3 scripts/test-ci-qa-guest.py
          python3 scripts/test-ci-qa-ssh.py

      - name: Deploy QA guards and OCI fixture contract
        run: python3 scripts/test-ci-qa-deploy.py

      - name: Public Tunnel preflight contract
        run: python3 scripts/test-check-public-tunnel.py

      - name: Public Tunnel app probe contract
        run: python3 scripts/test-check-public-tunnel-app.py

      - name: Public Tunnel acceptance safety contracts
        run: |
          python3 scripts/test_public_tunnel_credentials.py
          python3 scripts/test_public_tunnel_fixture.py
          python3 scripts/test_public_tunnel_setup.py
          python3 scripts/test_public_tunnel_acceptance.py

      - name: CI Deploy Action client contract
        run: python3 scripts/test-deploy-ci-client.py

      - name: Sandbox live QA evidence and ownership guards
        run: python3 scripts/test-ci-qa-ai-sandbox.py

      - name: Project workspace live QA ownership guards
        run: python3 scripts/test-ci-qa-project-workspace.py

      - name: Sandbox recovery QA ownership and fault guards
        run: python3 scripts/test-ci-qa-ai-sandbox-recovery.py

      - name: Sandbox coordination QA evidence guards
        run: python3 scripts/test-ci-qa-ai-sandbox-coordination.py

      - name: Sandbox prepared image and environment fixture guards
        run: |
          python3 scripts/test-sandbox-environment-seed.py
          python3 scripts/test-sandbox-oci-archive.py
          python3 scripts/test-sandbox-oci-startup.py
          setpriv --no-new-privs python3 scripts/test-qa-sandbox-http-ws.py
          python3 scripts/test-qa-sandbox-openrc-v1.py

      - name: Database QA guards and cleanup contract
        run: python3 scripts/test-pipe-databases-qa.py

      - name: Queue QA target and failure contracts
        run: python3 scripts/test-queue-runtime-qa.py

      - name: macOS repair QA guard and restoration contract
        run: python3 -m unittest scripts/test_macos_repair_qa.py scripts/test_macos_os_repair_qa.py scripts/test_macos_os_files.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Unit, settings terminal, and Pipe systemd tests + coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --workspace --exclude firecrab-helper --locked
          # Fork/exec tests can temporarily inherit another test's TCP listener.
          # Keep helper port-release assertions isolated from those processes.
          cargo test -p firecrab-helper --locked -- --test-threads=1
          # The guest contract creates real users. Run only this test binary in
          # an isolated disposable root container; retain its instrumented profile.
          api_test_binary=$(cargo test -p firecrab-api --bin firecrab-api --no-run --message-format=json | python3 -c 'import json,sys; entries=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in entries if item.get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("target", {}).get("name") == "firecrab-api" and item.get("executable")))')
          bash scripts/test-ai-sandbox-guest.sh "$api_test_binary" "$CARGO_LLVM_COV_TARGET_DIR"
          # The terminal test is ignored by cargo test because it needs a PTY.
          # Run its instrumented binary before exporting the coverage report.
          test_binary=$(cargo test -p firecrab-cli --no-run --message-format=json | python3 -c 'import json,sys; entries=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in entries if item.get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("target", {}).get("name") == "firecrab" and item.get("executable")))')
          python3 scripts/test-micromanager-settings.py --test-binary "$test_binary"
          cargo build -p firecrab-cli -p firecrab-api -p firecrab-helper --locked
          bin="$CARGO_LLVM_COV_TARGET_DIR/debug"
          sudo --preserve-env=LLVM_PROFILE_FILE python3 scripts/ci-qa-bridge-mac.py --helper "$bin/firecrab-helper"
          # The API runs as nobody; its helper runs in a systemd sandbox that
          # hides /home. Collect their profiles outside the runner's checkout.
          profiles=$(mktemp -d /var/tmp/firecrab-coverage.XXXXXX)
          chmod 1777 "$profiles"
          trap 'sudo rm -rf "$profiles"' EXIT
          export LLVM_PROFILE_FILE="$profiles/firecrab-%p-%m.profraw"
          sudo install -d -m 0755 /var/lib/firecrab-pipe-qa
          sudo install -m 0755 target/ingress/firecrab-ingress /var/lib/firecrab-pipe-qa/firecrab-ingress
          sudo --preserve-env=LLVM_PROFILE_FILE env FIRECRAB_LIBDIR=/var/lib/firecrab-pipe-qa "$bin/firecrab" pipe install
          # A second install verifies the cached executable and digest record.
          sudo --preserve-env=LLVM_PROFILE_FILE env FIRECRAB_LIBDIR=/var/lib/firecrab-pipe-qa "$bin/firecrab" pipe install
          cloudflared=/var/lib/firecrab-pipe-qa/pipe/cloudflared
          python3 scripts/test-pipe-runtime.py --firecrab "$bin/firecrab" --nginx target/ingress/firecrab-ingress
          python3 scripts/test-deploy-nginx.py --firecrab "$bin/firecrab" --nginx target/ingress/firecrab-ingress
          sudo --preserve-env=LLVM_PROFILE_FILE python3 scripts/test-pipe-cli.py --firecrab "$bin/firecrab" --nginx target/ingress/firecrab-ingress --cloudflared "$cloudflared"
          sudo --preserve-env=LLVM_PROFILE_FILE python3 scripts/test-firecrab-address.py --firecrab "$bin/firecrab" --nginx target/ingress/firecrab-ingress
          sudo --preserve-env=LLVM_PROFILE_FILE python3 scripts/test-pipe-api.py --api "$bin/firecrab-api" --helper "$bin/firecrab-helper" --ingress target/ingress/firecrab-ingress
          cp "$profiles"/*.profraw "$CARGO_LLVM_COV_TARGET_DIR/"
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Retain native coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-coverage
          path: lcov.info
          retention-days: 7

  vm-socket-failover:
    name: VM socket failover (real Nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: socket-failover-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build helper tests and private ingress
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools iproute2
          ./scripts/build-ingress.sh target/ingress
          cargo test -p firecrab-helper vm_connections:: --locked
      - name: Reset dead sockets with the helper's network capability
        run: |
          helper_test_binary=$(cargo test -p firecrab-helper --no-run --message-format=json | python3 -c 'import json,sys; entries=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in entries if item.get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("target", {}).get("name") == "firecrab-helper" and item.get("executable")))')
          socket_qa_dir=$(mktemp -d /var/tmp/firecrab-socket-qa.XXXXXX)
          trap 'sudo rm -rf "$socket_qa_dir"' EXIT
          sudo chown root:root "$socket_qa_dir"
          sudo install -m 0755 "$helper_test_binary" "$socket_qa_dir/helper-tests"
          sudo install -m 0755 target/ingress/firecrab-ingress "$socket_qa_dir/ingress"
          sudo systemd-run --quiet --wait --pipe --collect \
            -p CapabilityBoundingSet=CAP_NET_ADMIN -p NoNewPrivileges=yes \
            --setenv=FIRECRAB_SOCKET_RESET_QA=1 \
            --setenv=FIRECRAB_TEST_INGRESS="$socket_qa_dir/ingress" \
            --working-directory="$socket_qa_dir" \
            "$socket_qa_dir/helper-tests" --ignored --exact \
            vm_connections::tests::reset_dead_upstream_retries_without_cutting_healthy_requests \
            --test-threads=1

  dev-container-runtime:
    name: Worktree dev (private Docker runtime, real KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Private release bootstrap contracts
        run: python3 scripts/test-dev-container-bootstrap.py

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Require local Docker and KVM devices
        run: |
          test -c /dev/kvm
          test -c /dev/net/tun
          sudo chmod a+rw /dev/kvm
          docker version

      - name: Verify two private systemd runtimes and stop isolation
        # This test uses the production Dockerfile, entrypoint, and API relay.
        # It checks marker isolation, then installs and restores the verified
        # release API/helper in one runtime while preserving the other runtime.
        # It does not build source services or create MicroVMs.
        run: >-
          cargo test -p firecrab-cli --locked
          micromanager::dev::container::runtime_tests::private_docker_runtimes_keep_namespaces_data_and_stop_independent
          -- --ignored --exact --nocapture --test-threads=1

  dev-container-source:
    name: Worktree dev (source build, MicroVM isolation and restore, real KVM)
    # The fresh guest compiler/cache makes this a longer explicit acceptance run.
    if: github.event_name == 'workflow_dispatch'
    needs: dev-container-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Require local Docker and KVM devices
        run: |
          test -c /dev/kvm
          test -c /dev/net/tun
          sudo chmod a+rw /dev/kvm
          docker version

      - name: Build source and restore the release while preserving the other MicroVM
        run: >-
          cargo test -p firecrab-cli --locked
          micromanager::dev::container::runtime_tests::private_docker_source_build_and_restore_preserve_the_other_runtime
          -- --ignored --exact --nocapture --test-threads=1

  micromanager-macos-build:
    name: microManager (GitHub-hosted macOS build)
    # GitHub-hosted ARM64 macOS does not expose nested virtualization. Keep
    # this job to build/unit/signing checks. Runtime E2E remains a manual
    # native-Mac check because this repository has no self-hosted Mac runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Swift unit tests
        run: >-
          swift test --package-path micromanager-macos
          --scratch-path target/swift-micromanager-tests

      - name: Build signed helper and CLI
        run: |
          scripts/build-micromanager-macos.sh target/debug/firecrab-micromanager-macos
          codesign --verify --strict target/debug/firecrab-micromanager-macos
          codesign -d --entitlements :- target/debug/firecrab-micromanager-macos 2>&1 \
            | grep -q com.apple.security.virtualization
          cargo build -p firecrab-cli --locked

      - name: macOS CLI clippy and tests
        run: |
          cargo clippy -p firecrab-cli --all-targets -- -D warnings
          cargo test -p firecrab-cli --locked
          target/debug/firecrab --help
          target/debug/firecrab host list

      - name: Source development deployment contract
        run: python3 scripts/test-micromanager-dev.py

      - name: Managed update regression checks
        run: python3 scripts/test-micromanager-update.py

      - name: Verify hosted-runner diagnostic contract
        run: |
          rc=0
          target/debug/firecrab-micromanager-macos doctor --json > doctor.json || rc=$?
          test "$rc" -eq 0 -o "$rc" -eq 1
          python3 -m json.tool doctor.json

  micromanager-windows-build:
    name: microManager (GitHub-hosted Windows build)
    # GitHub-hosted Windows runners do not expose nested virtualization to
    # WSL2. Keep this job to build/unit/diagnostic checks. Runtime E2E remains
    # a manual Windows-host check, like the native-Mac check for macOS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Windows CLI clippy
        run: cargo clippy -p firecrab-cli --all-targets -- -D warnings

      - name: Windows CLI tests
        run: cargo test -p firecrab-cli --locked

      - name: Windows CLI build
        run: cargo build -p firecrab-cli --locked

      - name: Windows QA runner contract (PowerShell 5.1)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-ci-qa-windows.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firecrab-e2e/package-lock.json

      - name: Cross-platform browser runner contracts
        run: |
          npm ci --prefix firecrab-e2e
          npm run test:runner --prefix firecrab-e2e

      - name: Verify hosted-runner diagnostic contract
        shell: pwsh
        run: |
          $json = & target/debug/firecrab.exe service doctor --json
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 1) { throw "doctor exited with $rc" }
          $report = $json | Out-String | ConvertFrom-Json
          $json | Out-String | Set-Content -Path doctor.json -Encoding UTF8
          if ($report.platform -ne 'Windows') { throw "unexpected platform $($report.platform)" }
          $report.checks | Format-Table id, status, detail -AutoSize
          exit 0

  micromanager-pr-report:
    name: microManager PR report
    # On a pull request that touches macOS or Windows microManager files,
    # keeps one comment with each job's steps and log tails, the commands that
    # reproduce the job locally, and the runtime E2E the hosted runners cannot
    # run. Fork pull requests get the job summary only: their token is
    # read-only.
    needs: [micromanager-macos-build, micromanager-windows-build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Comment the microManager jobs on the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/micromanager-pr-report.py

  docs:
    name: Rust (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation links
        # Public doc links and public-docs paths quoted in source and scripts.
        # scripts and the READMEs are plain strings — nothing else in this
        # pipeline notices when a file moves out from under them.
        run: python3 scripts/check-doc-links.py

      - name: Changelog
        # First public release notes and the section contract used by
        # release.yml when a v* tag publishes GitHub Release notes.
        run: |
          python3 scripts/check-product-versions.py
          python3 -m unittest scripts/test_check_changelog.py
          python3 -m unittest scripts/test_write_release_notes.py
          python3 scripts/check-changelog.py

      - name: Native kernel builder
        run: python3 -m unittest scripts/test_build_host_kernel.py scripts/test_ci_prepare_stable_kernel.py

      - name: microManager PR report
        run: python3 -m unittest scripts/test_micromanager_pr_report.py

      - name: PR and issue contributor assignees
        run: node --test scripts/test-assign-contributor.mjs

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - name: cargo doc
        # Denies warnings so broken intra-doc links / invalid rustdoc syntax
        # fail CI instead of silently shipping a broken docs build.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      - name: rustdoc coverage floor
        # --show-coverage is nightly-only rustdoc; RUSTC_BOOTSTRAP=1 unlocks it
        # on the pinned stable toolchain. Floor is a documentation-completeness
        # target (75%), not a regression guard. Display enough precision to
        # explain failures just below the floor without rounding them to 75.0%.
        run: |
          RUSTC_BOOTSTRAP=1 RUSTDOCFLAGS="-Z unstable-options --show-coverage" \
            cargo doc --workspace --no-deps --document-private-items | tee doc-coverage.txt
          python3 - doc-coverage.txt <<'PY'
          import re, sys

          documented = total = 0
          for line in open(sys.argv[1]):
              m = re.match(r"\|\s*Total\s*\|\s*(\d+)\s*\|\s*([\d.]+)%", line)
              if not m:
                  continue
              count, pct = int(m.group(1)), float(m.group(2))
              documented += count
              if pct > 0:
                  total += round(count / (pct / 100))

          pct = (documented / total * 100) if total else 0.0
          threshold = 75.0
          summary = f"**rustdoc coverage: {documented}/{total} items ({pct:.4f}%)** — floor {threshold}%\n"
          print(summary)
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          if pct < threshold:
              print(f"FAIL: below {threshold}% floor")
              sys.exit(1)
          PY

  e2e-dashboard:
    name: Browser E2E (dashboard and Secrets, no guest boot)
    # Playwright specs tagged @dashboard fake the API or console they need, so
    # they run without KVM or the net helper. Guest-boot halves stay manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firecrab-frontend/package-lock.json
            firecrab-e2e/package-lock.json

      - uses: ./.github/actions/setup-wasm

      - name: Install dashboard and E2E dependencies
        run: |
          npm ci --prefix firecrab-frontend
          npm ci --prefix firecrab-e2e
          npx --prefix firecrab-e2e playwright install --with-deps chromium

      - name: Framework-independent dashboard regression specs
        run: npm --prefix firecrab-e2e run test:dashboard

      - name: PIPE database E2E types
        run: npm run typecheck:pipe --prefix firecrab-e2e

      - name: Secrets QA runner contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/test-ci-qa-secrets.py

      - name: PipeSecrets QA (unit, UI, real API and encrypted vault)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci-qa-secrets.py

      - name: Browser and Secrets QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dashboard-results
          path: |
            firecrab-e2e/test-results
            target/qa/secrets
          retention-days: 14

  wasm-terminal:
    name: WASM terminal (${{ matrix.browser }}, production)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      FIRECRAB_MOCKED_E2E_PRODUCTION: "1"
      FIRECRAB_MOCKED_E2E_CROSS_BROWSER: "1"
      FIRECRAB_MOCKED_E2E_BASE_URL: http://127.0.0.1:8099
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firecrab-frontend/package-lock.json
            firecrab-e2e/package-lock.json
      - uses: ./.github/actions/setup-wasm
      - name: Install dashboard and browser test dependencies
        run: |
          npm ci --prefix firecrab-frontend
          npm ci --prefix firecrab-e2e
          npx --prefix firecrab-e2e playwright install --with-deps ${{ matrix.browser }}
      - name: Check WASM browser test types
        run: node firecrab-e2e/node_modules/tsrs/bin/tsrs -p firecrab-e2e/tsconfig.wasm.json
      - name: Check the production WASM console and session behavior
        run: >-
          npm run test:mocked --prefix firecrab-e2e --
          tests/wasm-terminal.spec.ts tests/console-session.spec.ts
          --project ${{ matrix.browser }}
      - name: Verify standalone WASM artifacts
        run: node --test firecrab-e2e/scripts/test-terminal-build.mjs
      - name: WASM terminal browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-terminal-${{ matrix.browser }}
          path: firecrab-e2e/test-results
          retention-days: 14

  pipe-databases:
    name: PIPE databases (real API, PostgreSQL, MySQL, TLS and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # Continuous profiles survive the isolated QA API's SIGTERM/restart.
      RUSTFLAGS: "-C llvm-args=-runtime-counter-relocation"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install Rust and database clients
        run: |
          rustup show
          sudo apt-get update
          sudo apt-get install -y postgresql-client default-mysql-client openssl
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firecrab-frontend/package-lock.json
            firecrab-e2e/package-lock.json
      - uses: ./.github/actions/setup-wasm

      - name: Build dashboard
        run: |
          npm ci --prefix firecrab-frontend
          npm ci --prefix firecrab-e2e
          npm ci --prefix examples/database-events
          npm run build --prefix firecrab-frontend
          npm run typecheck:pipe --prefix firecrab-e2e
          npx --prefix firecrab-e2e playwright install --with-deps chromium
      - name: Real database and desktop/mobile QA with coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo build -p firecrab-api --locked
          export LLVM_PROFILE_FILE="$CARGO_LLVM_COV_TARGET_DIR/pipe-databases-%p-%m%c.profraw"
          bash scripts/ci-qa-pipe-databases.sh --api "$CARGO_LLVM_COV_TARGET_DIR/debug/firecrab-api" --browser
          cargo test -p firecrab-api --bin firecrab-api --no-run --locked --message-format=json > target/qa/database-service-tests.jsonl
          test_binary=$(python3 -c 'import json; rows=[json.loads(line) for line in open("target/qa/database-service-tests.jsonl")]; print(next(row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("profile",{}).get("test") and row.get("target",{}).get("name")=="firecrab-api" and row.get("executable")))')
          python3 scripts/ci-qa-database-services.py --test-binary "$test_binary" --profiles "$CARGO_LLVM_COV_TARGET_DIR"
          cargo llvm-cov report --lcov --output-path pipe-databases.lcov.info
      - name: Upload database QA coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: pipe-databases.lcov.info
          flags: pipe-databases
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Retain QA report and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipe-databases-qa
          path: |
            target/qa/pipe-databases.json
            target/qa/pipe-databases.api.log
            pipe-databases.lcov.info
            firecrab-e2e/test-results/pipe-live-*
          retention-days: 7

  install:
    name: Installer (shellcheck, --check, doctor, install/uninstall)
    # GitHub Ubuntu exposes /dev/kvm on typical x86_64 hosted runners. Nested
    # virt is not a stability guarantee; if the device is missing this job fails
    # the guest-boot step instead of skipping it. Full E2E still belongs on a
    # self-hosted runner when flake rate matters.
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - name: shellcheck
        run: |
          shellcheck install.sh scripts/ci-qa-helper-upgrade.sh scripts/ci-qa-pipe-databases.sh scripts/firecrab-release.sh scripts/package-host-release.sh \
            scripts/build-guest-console.sh scripts/build-guest-kernel.sh scripts/build-host-kernel.sh \
            scripts/firecracker-menual/install-linux-kernel.sh \
            scripts/build-micromanager-macos.sh \
            scripts/bake-install-sh.sh scripts/ci-prepare-install-payload.sh \
            scripts/ci-qa-api.sh \
            scripts/ci-qa-guest.sh \
            scripts/ci-qa-lifetime.sh \
            scripts/ci-qa-nginx.sh \
            scripts/ci-qa-ssh.sh \
            scripts/ci-qa-macos-e2e.sh \
            scripts/micromanager/dev-macos-guest.sh \
            scripts/ci-m2-guest-boot.sh \
            scripts/verify-release-binary.sh \
            scripts/smoke-release-exec.sh scripts/test-smoke-release-exec.sh \
            scripts/build-m2images.sh scripts/package-m2images.sh \
            scripts/publish-m2images-r2.sh \
            scripts/firecracker-menual/install-alpine-rootfs.sh \
            scripts/firecracker-menual/install-ubuntu-roofs.sh \
            scripts/firecracker-menual/install-rocky-rootfs.sh
          shellcheck -s sh \
            scripts/firecracker-menual/bootstrap-alpine-in-guest.sh \
            scripts/firecracker-menual/bootstrap-ubuntu-in-guest.sh \
            scripts/firecracker-menual/bootstrap-rocky-in-guest.sh

      - name: M2Image release manifest
        run: |
          python3 scripts/m2image-manifest.py validate
          test "$(./scripts/build-m2images.sh --list | wc -l)" -eq 3

      - name: --help, --check, and --doctor (unprivileged, no mutation)
        # --check / --doctor have to work unprivileged and change nothing; a
        # check that quietly mutates is worse than no check.
        run: |
          bash -n install.sh
          bash scripts/test-firecrab-release.sh
          bash scripts/test-install-cli.sh
          bash scripts/test-smoke-release-exec.sh
          ./install.sh --help
          ./install.sh --check
          test ! -e /var/lib/firecrab || { echo "--check created the data directory"; exit 1; }
          cargo build -p firecrab-cli
          ./target/debug/firecrab doctor --help
          # Bare runner will typically FAIL helper socket / images; doctor must
          # still exit 0 or 1 (not crash) and leave the host untouched.
          BEFORE=$(ls -la /var/lib/firecrab 2>&1 || true)
          set +e
          ./install.sh --doctor
          doctor_rc=$?
          set -e
          test "$doctor_rc" -eq 0 -o "$doctor_rc" -eq 1 \
            || { echo "doctor exited $doctor_rc (want 0 or 1)"; exit 1; }
          AFTER=$(ls -la /var/lib/firecrab 2>&1 || true)
          test "$BEFORE" = "$AFTER" || { echo "--doctor mutated host state"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firecrab-frontend/package-lock.json
            firecrab-e2e/package-lock.json

      - uses: ./.github/actions/setup-wasm

      - name: Install cargo-llvm-cov for runtime QA
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build install payload
        # CI installs from local binaries, not GitHub Releases (PRs have none).
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          FIRECRAB_QA_COVERAGE=1 ./scripts/ci-prepare-install-payload.sh

      - name: Install
        id: install-service
        # install.sh never installs a guest image itself now — deps, account,
        # directories, units, dashboard are all still real.
        run: |
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist

      - name: Collect continuous runtime QA profiles
        run: |
          sudo install -d -m 1777 /var/lib/firecrab-qa-coverage
          for unit in firecrab-api firecrab-helper; do
            sudo mkdir -p "/run/systemd/system/$unit.service.d"
            printf '%s\n' '[Service]' \
              'Environment=LLVM_PROFILE_FILE=/var/lib/firecrab-qa-coverage/firecrab-%%p-%%m%%c.profraw' \
              | sudo tee "/run/systemd/system/$unit.service.d/85-ci-coverage.conf"
          done
          sudo systemctl daemon-reload
          sudo systemctl restart firecrab-helper firecrab-api

      - name: Both daemons are up
        run: |
          systemctl is-active --quiet firecrab-helper
          systemctl is-active --quiet firecrab-api
          # The socket's group is what lets the unprivileged API reach the
          # helper at all; getting it wrong is a silent, confusing failure.
          # Needs sudo to look at: /run/firecrab is 0750 root:firecrab, so the
          # runner user cannot even traverse it - which is the point.
          sudo stat -c '%U %G %a' /run/firecrab/net-helper.sock | tee /dev/stderr | grep -qx 'root firecrab 660'
          id -nG firecrab | tr ' ' '\n' | grep -qx kvm
          test -x /usr/local/bin/firecrab

      - name: Doctor after install
        # Runtime host path must be clean. Run from the unit WorkingDirectory
        # so the checkout's data/firecrab.db is not counted as a second DB.
        # Images are intentionally absent (install.sh never fetches one), so
        # the only acceptable FAIL is the images check. sudo so nft/ufw are
        # not SKIP'd.
        run: |
          set +e
          out=$(sudo env DATADIR=/var/lib/firecrab \
                bash -c 'cd /var/lib/firecrab && firecrab doctor' 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "$out" | grep -q 'all checks passed'
            exit 0
          fi
          unexpected=$(printf '%s\n' "$out" | grep '^\[FAIL\]' | grep -v '^\[FAIL\] images:' || true)
          if [ -n "$unexpected" ]; then
            echo "doctor reported unexpected failures:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          # At least one image FAIL, and nothing else.
          printf '%s\n' "$out" | grep -q '^\[FAIL\] images:'
          test "$code" -eq 1

      - name: QA work list (API, no guest boot)
        # Shared QA IDs from public-docs/development/qa.md: see scripts/ci-qa-api.sh.
        # Leaves the later "ci" / 172.31.0.0/24 smoke network contract unchanged.
        run: |
          mkdir -p target/qa
          scripts/ci-qa-api.sh 2>&1 | tee target/qa/api.log

      - name: Enable KVM
        id: enable-kvm
        run: |
          # Device events can reset a one-time chmod during the long guest QA.
          # Keep this disposable runner's KVM access across those events.
          printf '%s\n' 'KERNEL=="kvm", MODE:="0666"' \
            | sudo tee /etc/udev/rules.d/99-firecrab-ci-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=/dev/kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo -u firecrab test -r /dev/kvm
          sudo -u firecrab test -w /dev/kvm

      - name: Prepare Chromium and local OCI fixture
        id: browser-deps
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server busybox-static \
            build-essential flex bison bc perl xz-utils libelf-dev libssl-dev
          npm ci --prefix firecrab-e2e
          npm run test:runner --prefix firecrab-e2e
          ./firecrab-e2e/node_modules/.bin/playwright install --with-deps chromium
          # Reuse the installed API; its OCI toolbox comes from the local
          # static binary so the fixture does not pull a Docker Hub image.
          sudo mkdir -p /run/systemd/system/firecrab-api.service.d
          printf '[Service]\nEnvironment=FIRECRAB_OCI_TOOLBOX_PATH=/usr/bin/busybox\n' \
            | sudo tee /run/systemd/system/firecrab-api.service.d/90-ci-e2e.conf
          sudo systemctl daemon-reload
          sudo systemctl restart firecrab-api
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5523/api/host >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5523/api/host >/dev/null

      - name: Build current stable guest kernel
        id: guest-kernel
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          sudo python3 scripts/ci-prepare-stable-kernel.py \
            --timeout 1800 --output target/qa/guest-kernel.json --github-env "$GITHUB_ENV"

      - name: Guest console vsock and foreground resize
        if: ${{ !cancelled() && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          sudo python3 scripts/test-guest-console-vm.py \
            --kernel "$FIRECRAB_CI_KERNEL_PATH" \
            --helper /usr/local/lib/firecrab/firecrab-guest-console \
            --busybox /usr/bin/busybox --expected-release "$FIRECRAB_CI_KERNEL_RELEASE" \
            --report target/qa/guest-console-vm.json

      - name: Deploy with real MicroVMs and Nginx
        if: ${{ !cancelled() && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 25
        run: sudo python3 scripts/ci-qa-deploy.py --disposable-host --secret-rotation --replica-recovery --queue-controls --automatic-deploy --ci-deploy --observability --report target/qa/secret-rotation.json 2>&1 | tee target/qa/deploy.log

      - name: Retain Deploy acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-acceptance-${{ github.run_attempt }}
          path: |
            target/qa/secret-rotation.json
            target/qa/deploy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Chromium E2E with real guest boot and dual-stack SSH
        if: ${{ !cancelled() && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 30
        env:
          FIRECRAB_E2E_REUSE_SERVER: "1"
          FIRECRAB_E2E_REQUIRE_GUEST_BOOT: "1"
          FIRECRAB_E2E_REQUIRE_RUNNING_API: "1"
          FIRECRAB_E2E_REQUIRE_GUEST_RESIZE: "1"
        run: |
          # Report console failures before running the broad dashboard suite.
          npm run test:console --prefix firecrab-e2e 2>&1 | tee target/qa/console-browser.log
          npm test --prefix firecrab-e2e -- --grep-invert 'terminal session end' 2>&1 | tee target/qa/browser.log

      - name: QA nginx env, port-forward, shells
        if: ${{ !cancelled() && steps.install-service.outcome == 'success' && steps.enable-kvm.outcome == 'success' && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 25
        run: scripts/ci-qa-nginx.sh nginx:1.27-alpine 2>&1 | tee target/qa/nginx.log

      - name: QA guest boot (OCI alpine, ubuntu, fedora)
        if: ${{ !cancelled() && steps.install-service.outcome == 'success' && steps.enable-kvm.outcome == 'success' && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 90
        # Every reference runs I5 + V1/V7/V8/V11/V13/X5; fresh later aliases
        # use the API for I6, while the first fresh alias uses the CLI.
        # The first reference additionally runs N6/V2/V6/V9/V12 and C1/C2/C4;
        # a pre-existing first alias is preserved and its unperformed import is
        # reported as WARNING rather than a false PASS.
        # The first reference also runs P1-P7, C6, and X7.
        run: FIRECRAB_QA_POOL_RESTART=1 scripts/ci-qa-guest.sh alpine:3.21 ubuntu:24.04 fedora:42 2>&1 | tee target/qa/guest.log

      - name: QA VM lifetime
        timeout-minutes: 30
        # R1–R7 and X7 from public-docs/development/qa.md; restarts the installed API.
        env:
          FIRECRAB_QA_HELPER_UPGRADE: "1"
        run: scripts/ci-qa-lifetime.sh alpine:3.21

      - name: Dashboard, MicroNetwork, and create-VM API smoke
        # No guest image here, so no guest boot. Still exercise the
        # control-plane path that PR CI used to skip: create a network,
        # reject bad creates, and leave a real MicroNetwork for the
        # capability checks below.
        run: |
          set -o pipefail
          curl -fsS -o /dev/null -w 'dashboard %{http_code} %{content_type}\n' http://127.0.0.1:5523/
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

          # Fresh install has zero MicroNetworks (no implicit fcbr0).
          NET=$(curl -fsS -X POST http://127.0.0.1:5523/api/micro-networks \
                 -H 'Origin: http://127.0.0.1:5523' -H 'content-type: application/json' \
                 -d '{"name":"ci","subnetCidr":"172.31.0.0/24","internetEnabled":true}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "NET=$NET"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5523/api/micro-networks \
               -H 'Origin: http://evil.example' -H 'content-type: application/json' \
               -d '{"name":"nope","subnetCidr":"172.32.0.0/24","internetEnabled":true}')" = 403

          # microNetworkId is required (serde) — omit it → 400.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d '{"name":"no-net","template":"alpine-3.24","cpu":1,"ram":512,"diskGb":2}')" = 400

          # Unknown MicroNetwork → 400 field error, no VM row left behind.
          code=$(curl -s -o /tmp/create-bad-net.json -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d '{"name":"bad-net","template":"alpine-3.24","cpu":1,"ram":512,"diskGb":2,"microNetworkId":"00000000-0000-0000-0000-000000000099"}')
          test "$code" = 400
          grep -q microNetworkId /tmp/create-bad-net.json
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

          # Valid network but no guest image installed → template rejected.
          code=$(curl -s -o /tmp/create-no-image.json -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d "{\"name\":\"need-image\",\"template\":\"alpine-3.24\",\"cpu\":1,\"ram\":512,\"diskGb\":2,\"microNetworkId\":\"$NET\"}")
          test "$code" = 400
          grep -q template /tmp/create-no-image.json
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

      - name: Capability set is sufficient at runtime
        # After at least one MicroNetwork exists, the helper has exercised
        # NET_ADMIN (bridge) and SETUID/SETGID/NET_BIND_SERVICE/KILL (dnsmasq).
        run: |
          # Explicit MicroNetwork bridge (mnb*), not the removed default fcbr0.
          ip -br link show type bridge | grep -Eq '^mnb'
          # Gateway address lives on that bridge (ci network was 172.31.0.0/24).
          ip -br addr | grep -Eq 'mnb.*172\.31\.0\.1/24'
          sudo pgrep -af dnsmasq | grep -q firecrab
          sudo ss -lun | grep -q ':67'
          ! sudo journalctl -u firecrab-helper --no-pager | grep -i 'operation not permitted'

      - name: Queue MicroVM persistence and app disconnects
        id: queue-qa
        if: ${{ !cancelled() && steps.install-service.outcome == 'success' && steps.enable-kvm.outcome == 'success' && steps.guest-kernel.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          # PrivateTmp hides /var/tmp from the installed API. Its data directory
          # is writable under the real service sandbox and survives API restart.
          sudo install -d -o firecrab -g firecrab -m 0700 /var/lib/firecrab/coverage
          sudo mkdir -p /run/systemd/system/firecrab-api.service.d
          # Double percent signs escape systemd specifiers; LLVM expands them.
          printf '%s\n' '[Service]' 'Environment=LLVM_PROFILE_FILE=/var/lib/firecrab/coverage/queue-%%p-%%m%%c.profraw' \
            | sudo tee /run/systemd/system/firecrab-api.service.d/91-queue-coverage.conf
          sudo systemctl daemon-reload
          sudo systemctl restart firecrab-api
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5523/api/host >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5523/api/host >/dev/null
          npm ci --prefix examples/queue
          python3 scripts/ci-qa-queue.py --disposable-host --restart-api

      - name: Export real Queue runtime coverage
        id: queue-coverage
        if: ${{ !cancelled() && steps.queue-qa.outcome == 'success' }}
        run: |
          sudo systemctl stop firecrab-api
          sudo tar -C /var/lib/firecrab/coverage -cf - . | tar -C target -xf -
          sudo systemctl start firecrab-api
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --release --lcov --output-path queue-runtime.lcov.info

      - name: Upload Queue runtime coverage to Codecov
        if: ${{ !cancelled() && steps.queue-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: queue-runtime.lcov.info
          flags: queue-runtime
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Re-running is safe
        run: |
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist
          systemctl is-active --quiet firecrab-api
          # The MicroNetwork created above has to survive a re-install.
          curl -fsS http://127.0.0.1:5523/api/micro-networks | grep -q '"ci"'

      - name: Uninstall keeps data, purge removes it
        run: |
          # A MicroVM unit still running at uninstall time has to go with it. The
          # uninstaller goes by the unit name alone, so a sleep stands in for a VM.
          vm_unit=firecrab-vm-00000000000000000000000000000001.service
          sudo systemd-run --unit="$vm_unit" --collect --quiet sleep 600
          systemctl is-active --quiet "$vm_unit"
          sudo ./install.sh --uninstall
          if systemctl is-active --quiet firecrab-api; then
            echo 'FAILED: firecrab-api is still active after uninstall'
            exit 1
          fi
          if systemctl is-active --quiet "$vm_unit"; then
            echo 'FAILED: a MicroVM unit is still running after uninstall'
            exit 1
          fi
          test ! -e /etc/systemd/system/firecrab-api.service
          test ! -e /usr/local/bin/firecrab
          # The whole library directory goes, kernel extract scripts included.
          test ! -e /usr/local/lib/firecrab
          # The MicroNetwork created above leaves no device or NAT rule behind.
          # Captured first: under `pipefail`, `grep -q` ending the pipe early can
          # turn a match into a failed condition.
          links=$(ip -br link)
          if grep -Eq '^(mnb|fct|fcbr)' <<<"$links"; then
            echo 'FAILED: a firecrab network device survived the uninstall'
            exit 1
          fi
          nat=$(sudo iptables -t nat -S POSTROUTING)
          if grep -Eq -- '-s 172\.31\.0\.0/24 .*MASQUERADE' <<<"$nat"; then
            echo 'FAILED: the MicroNetwork NAT rule survived the uninstall'
            exit 1
          fi
          test ! -e /etc/firecrab/host-baseline.env
          test -d /var/lib/firecrab
          sudo ./install.sh --uninstall --purge
          test ! -e /var/lib/firecrab

      - name: Export runtime QA coverage
        if: ${{ !cancelled() && steps.install-service.outcome == 'success' }}
        run: |
          source <(cargo llvm-cov show-env --sh)
          sudo cp /var/lib/firecrab-qa-coverage/*.profraw "$CARGO_LLVM_COV_TARGET_DIR/"
          sudo chown "$(id -u):$(id -g)" "$CARGO_LLVM_COV_TARGET_DIR/"*.profraw
          cargo llvm-cov report --release --lcov --output-path target/qa/installer-lcov.info
          python3 - <<'PY'
          from pathlib import Path
          report = Path("target/qa/installer-lcov.info").read_text().split("end_of_record")
          for name in ["service_runtime/deploy.rs", "service_runtime/deploy/replicas.rs"]:
              blocks = [block for block in report if any(line.startswith("SF:") and line.endswith(name) for line in block.splitlines())]
              assert blocks and any(int(line.split(",")[1]) > 0 for block in blocks for line in block.splitlines() if line.startswith("DA:")), f"No real Deploy runtime coverage: {name}"
          PY

      - name: Upload runtime QA coverage to Codecov
        if: ${{ !cancelled() && hashFiles('target/qa/installer-lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: target/qa/installer-lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Daemon logs (on failure)
        if: failure()
        run: |
          sudo journalctl -u firecrab-helper --no-pager -n 60 || true
          sudo journalctl -u firecrab-api --no-pager -n 60 || true
          systemctl status firecrab-helper firecrab-api --no-pager || true
          sudo firecrab doctor 2>&1 || true

      - name: Retain QA logs and Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-runtime-qa-${{ github.run_attempt }}
          path: |
            target/qa/
            queue-runtime.lcov.info
            firecrab-e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

  install-distro:
    name: Installer deps (${{ matrix.image }})
    # GitHub only hosts Ubuntu for Linux, so other distributions are covered in
    # containers. No systemd there, hence --deps-only: what actually differs per
    # distribution is package naming, and that is what this exercises.
    # Full install with units stays on the runner VM above.
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Alpine is deliberately absent: GitHub's own action runtime is
        # glibc-linked and will not start in a musl container, and the upstream
        # firecracker release binary has the same problem.
        image:
          - debian:12
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed
    steps:
      - name: Bootstrap the container
        # Enough to run a bash script and check out the repo; the installer
        # takes it from there. Retries absorb transient mirror hiccups (seen
        # on fresh fedora:latest containers: dnf's metalink/zchunk repodata
        # fetch occasionally fails with a curl write error).
        run: |
          retry() {
            n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n + 1))
              echo "retrying ($n/5): $*" >&2
              sleep 5
            done
            return 1
          }

          if command -v apt-get >/dev/null; then
            retry apt-get update -qq && retry apt-get install -y -qq bash ca-certificates curl git
          elif command -v dnf >/dev/null; then
            retry dnf install -y -q bash ca-certificates curl git
          elif command -v pacman >/dev/null; then
            retry pacman -Sy --noconfirm --needed bash ca-certificates curl git
          elif command -v zypper >/dev/null; then
            # Read metadata and packages from the same origin: redirected
            # mirrors can lag behind repomd.xml and return 404 even after a
            # forced refresh. Keep HTTPS for every repository.
            sed -i \
              -e 's#^baseurl=http://#baseurl=https://#' \
              -e 's#//download\.opensuse\.org/#//downloadcontent.opensuse.org/#g' \
              /etc/zypp/repos.d/*.repo
            retry sh -c 'zypper --non-interactive clean --all && zypper --non-interactive --gpg-auto-import-keys refresh --force && zypper --non-interactive install --no-recommends bash ca-certificates curl git'
          fi
        shell: sh -e {0}

      - uses: actions/checkout@v7

      - name: --check reports this distro's package manager
        run: ./install.sh --check

      - name: --deps-only installs them for real
        # Containers run as root, so no sudo. The installer no longer pulls
        # rustc or Node — those belong to --bin-dir / the release bundle.
        run: ./install.sh --deps-only

      - name: Everything the daemons need is present
        run: |
          for command in ip nft dnsmasq mkfs.ext4 firecracker sha256sum; do
            command -v "$command" >/dev/null || { echo "missing: $command"; exit 1; }
          done

  frontend:
    name: Frontend (Rust/WASM lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firecrab-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firecrab-frontend/package-lock.json

      - uses: ./.github/actions/setup-wasm
      - run: npm ci
      - run: npm ci --prefix ../firecrab-e2e
      - run: ../firecrab-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Development dashboard lifecycle with real Vite
        run: node ../scripts/test-dev-dashboard.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm test
