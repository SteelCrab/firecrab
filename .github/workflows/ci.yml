name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The VM-boot job below is too slow for every PR but is the only thing that
  # proves a guest actually comes up, so it runs nightly and on demand.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        # rust-toolchain.toml pins channel 1.96.0 + clippy/rustfmt/llvm-tools
        run: rustup show

      - name: Install dnsmasq
        # firecrab-net-helper's dhcp.rs tests shell out to the real
        # `dnsmasq --test` to validate generated configs — not preinstalled
        # on the runner image.
        run: sudo apt-get update && sudo apt-get install -y dnsmasq

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Not -D warnings: several workspace crates carry dead_code warnings
        # for network-automation pieces (IPAM, egress policy, ...) that are
        # already merged ahead of the task that wires them up
        # (public-docs/networking.md).
        # Denying warnings here would fail CI on legitimate WIP, not bugs.
        run: cargo clippy --workspace --all-targets

      - name: cargo test -p firecrab-cli
        run: cargo test -p firecrab-cli --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test + coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Rust (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation links
        # Public doc links and public-docs paths quoted in source and scripts.
        # scripts and the READMEs are plain strings — nothing else in this
        # pipeline notices when a file moves out from under them.
        run: python3 scripts/check-doc-links.py

      - name: Changelog
        # First public release notes and the section contract used by
        # release.yml when a v* tag publishes GitHub Release notes.
        run: |
          python3 -m unittest scripts/test_check_changelog.py
          python3 -m unittest scripts/test_write_release_notes.py
          python3 scripts/check-changelog.py

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - name: cargo doc
        # Denies warnings so broken intra-doc links / invalid rustdoc syntax
        # fail CI instead of silently shipping a broken docs build.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      - name: rustdoc coverage floor
        # --show-coverage is nightly-only rustdoc; RUSTC_BOOTSTRAP=1 unlocks it
        # on the pinned stable toolchain. Floor is a documentation-completeness
        # target (75%), not a regression guard — current baseline is ~14%, so
        # this fails until doc comments are added across the workspace.
        run: |
          RUSTC_BOOTSTRAP=1 RUSTDOCFLAGS="-Z unstable-options --show-coverage" \
            cargo doc --workspace --no-deps --document-private-items | tee doc-coverage.txt
          python3 - doc-coverage.txt <<'PY'
          import re, sys

          documented = total = 0
          for line in open(sys.argv[1]):
              m = re.match(r"\|\s*Total\s*\|\s*(\d+)\s*\|\s*([\d.]+)%", line)
              if not m:
                  continue
              count, pct = int(m.group(1)), float(m.group(2))
              documented += count
              if pct > 0:
                  total += round(count / (pct / 100))

          pct = (documented / total * 100) if total else 0.0
          threshold = 75.0
          summary = f"**rustdoc coverage: {documented}/{total} items ({pct:.1f}%)** — floor {threshold}%\n"
          print(summary)
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          if pct < threshold:
              print(f"FAIL: below {threshold}% floor")
              sys.exit(1)
          PY

  install:
    name: Installer (shellcheck, --check, doctor, install/uninstall)
    # A GitHub-hosted Linux runner is a throwaway VM with systemd, so the whole
    # installer can be exercised for real — the one thing this cannot cover is
    # booting a guest, since install.sh never installs a guest image itself
    # (see below); that needs an M2Image package install, covered by vm-boot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - name: shellcheck
        run: |
          shellcheck install.sh scripts/firecrab-release.sh scripts/package-host-release.sh \
            scripts/bake-install-sh.sh scripts/ci-prepare-install-payload.sh \
            scripts/ci-install-m2image.sh \
            scripts/verify-release-binary.sh \
            scripts/smoke-release-exec.sh scripts/test-smoke-release-exec.sh \
            scripts/build-m2images.sh scripts/package-m2images.sh \
            scripts/publish-m2images-r2.sh \
            scripts/firecracker-menual/install-alpine-rootfs.sh \
            scripts/firecracker-menual/install-ubuntu-roofs.sh \
            scripts/firecracker-menual/install-rocky-rootfs.sh
          shellcheck -s sh \
            scripts/firecracker-menual/bootstrap-alpine-in-guest.sh \
            scripts/firecracker-menual/bootstrap-ubuntu-in-guest.sh \
            scripts/firecracker-menual/bootstrap-rocky-in-guest.sh

      - name: M2Image release manifest
        run: |
          python3 scripts/m2image-manifest.py validate
          test "$(./scripts/build-m2images.sh --list | wc -l)" -eq 3

      - name: --help, --check, and --doctor (unprivileged, no mutation)
        # --check / --doctor have to work unprivileged and change nothing; a
        # check that quietly mutates is worse than no check.
        run: |
          bash -n install.sh
          bash scripts/test-firecrab-release.sh
          bash scripts/test-install-cli.sh
          bash scripts/test-smoke-release-exec.sh
          ./install.sh --help
          ./install.sh --check
          test ! -e /var/lib/firecrab || { echo "--check created the data directory"; exit 1; }
          cargo build -p firecrab-cli
          ./target/debug/firecrab doctor --help
          # Bare runner will typically FAIL helper socket / images; doctor must
          # still exit 0 or 1 (not crash) and leave the host untouched.
          BEFORE=$(ls -la /var/lib/firecrab 2>&1 || true)
          set +e
          ./install.sh --doctor
          doctor_rc=$?
          set -e
          test "$doctor_rc" -eq 0 -o "$doctor_rc" -eq 1 \
            || { echo "doctor exited $doctor_rc (want 0 or 1)"; exit 1; }
          AFTER=$(ls -la /var/lib/firecrab 2>&1 || true)
          test "$BEFORE" = "$AFTER" || { echo "--doctor mutated host state"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firecrab-frontend/package-lock.json

      - name: Build install payload
        # CI installs from local binaries, not GitHub Releases (PRs have none).
        run: ./scripts/ci-prepare-install-payload.sh

      - name: Install
        # install.sh never installs a guest image itself now — deps, account,
        # directories, units, dashboard are all still real.
        run: |
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist

      - name: Both daemons are up
        run: |
          systemctl is-active --quiet firecrab-net-helper
          systemctl is-active --quiet firecrab-api
          # The socket's group is what lets the unprivileged API reach the
          # helper at all; getting it wrong is a silent, confusing failure.
          # Needs sudo to look at: /run/firecrab is 0750 root:firecrab, so the
          # runner user cannot even traverse it - which is the point.
          sudo stat -c '%U %G %a' /run/firecrab/net-helper.sock | tee /dev/stderr | grep -qx 'root firecrab 660'
          id -nG firecrab | tr ' ' '\n' | grep -qx kvm
          test -x /usr/local/bin/firecrab

      - name: Doctor after install
        # Runtime host path must be clean. Run from the unit WorkingDirectory
        # so the checkout's data/firecrab.db is not counted as a second DB.
        # Images are intentionally absent (install.sh never fetches one), so
        # the only acceptable FAIL is the images check. sudo so nft/ufw are
        # not SKIP'd.
        run: |
          set +e
          out=$(sudo env DATADIR=/var/lib/firecrab \
                bash -c 'cd /var/lib/firecrab && firecrab doctor' 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "$out" | grep -q 'all checks passed'
            exit 0
          fi
          unexpected=$(printf '%s\n' "$out" | grep '^\[FAIL\]' | grep -v '^\[FAIL\] images:' || true)
          if [ -n "$unexpected" ]; then
            echo "doctor reported unexpected failures:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          # At least one image FAIL, and nothing else.
          printf '%s\n' "$out" | grep -q '^\[FAIL\] images:'
          test "$code" -eq 1

      - name: Dashboard, MicroNetwork, and create-VM API smoke
        # No guest image here, so no guest boot. Still exercise the
        # control-plane path that PR CI used to skip: create a network,
        # reject bad creates, and leave a real MicroNetwork for the
        # capability checks below.
        run: |
          set -o pipefail
          curl -fsS -o /dev/null -w 'dashboard %{http_code} %{content_type}\n' http://127.0.0.1:5523/
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

          # Fresh install has zero MicroNetworks (no implicit fcbr0).
          NET=$(curl -fsS -X POST http://127.0.0.1:5523/api/micro-networks \
                 -H 'Origin: http://127.0.0.1:5523' -H 'content-type: application/json' \
                 -d '{"name":"ci","subnetCidr":"172.31.0.0/24","internetEnabled":true}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "NET=$NET"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5523/api/micro-networks \
               -H 'Origin: http://evil.example' -H 'content-type: application/json' \
               -d '{"name":"nope","subnetCidr":"172.32.0.0/24","internetEnabled":true}')" = 403

          # microNetworkId is required (serde) — omit it → 400.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d '{"name":"no-net","template":"alpine-3.24.1","cpu":1,"ram":512,"diskGb":2}')" = 400

          # Unknown MicroNetwork → 400 field error, no VM row left behind.
          code=$(curl -s -o /tmp/create-bad-net.json -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d '{"name":"bad-net","template":"alpine-3.24.1","cpu":1,"ram":512,"diskGb":2,"microNetworkId":"00000000-0000-0000-0000-000000000099"}')
          test "$code" = 400
          grep -q microNetworkId /tmp/create-bad-net.json
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

          # Valid network but no guest image installed → template rejected.
          code=$(curl -s -o /tmp/create-no-image.json -w '%{http_code}' -X POST http://127.0.0.1:5523/api/vms \
               -H 'content-type: application/json' \
               -d "{\"name\":\"need-image\",\"template\":\"alpine-3.24.1\",\"cpu\":1,\"ram\":512,\"diskGb\":2,\"microNetworkId\":\"$NET\"}")
          test "$code" = 400
          grep -q template /tmp/create-no-image.json
          test "$(curl -fsS http://127.0.0.1:5523/api/vms)" = '[]'

      - name: Capability set is sufficient at runtime
        # After at least one MicroNetwork exists, the helper has exercised
        # NET_ADMIN (bridge) and SETUID/SETGID/NET_BIND_SERVICE/KILL (dnsmasq).
        run: |
          # Explicit MicroNetwork bridge (mnb*), not the removed default fcbr0.
          ip -br link show type bridge | grep -Eq '^mnb'
          # Gateway address lives on that bridge (ci network was 172.31.0.0/24).
          ip -br addr | grep -Eq 'mnb.*172\.31\.0\.1/24'
          sudo pgrep -af dnsmasq | grep -q firecrab
          sudo ss -lun | grep -q ':67'
          ! sudo journalctl -u firecrab-net-helper --no-pager | grep -i 'operation not permitted'

      - name: Re-running is safe
        run: |
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist
          systemctl is-active --quiet firecrab-api
          # The MicroNetwork created above has to survive a re-install.
          curl -fsS http://127.0.0.1:5523/api/micro-networks | grep -q '"ci"'

      - name: Uninstall keeps data, purge removes it
        run: |
          sudo ./install.sh --uninstall
          ! systemctl is-active --quiet firecrab-api
          test ! -e /etc/systemd/system/firecrab-api.service
          test ! -e /usr/local/bin/firecrab
          test -d /var/lib/firecrab
          sudo ./install.sh --uninstall --purge
          test ! -e /var/lib/firecrab

      - name: Daemon logs (on failure)
        if: failure()
        run: |
          sudo journalctl -u firecrab-net-helper --no-pager -n 60 || true
          sudo journalctl -u firecrab-api --no-pager -n 60 || true
          systemctl status firecrab-net-helper firecrab-api --no-pager || true
          sudo firecrab doctor 2>&1 || true

  install-distro:
    name: Installer deps (${{ matrix.image }})
    # GitHub only hosts Ubuntu for Linux, so other distributions are covered in
    # containers. No systemd there, hence --deps-only: what actually differs per
    # distribution is package naming, and that is what this exercises.
    # Full install with units stays on the runner VM above.
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Alpine is deliberately absent: GitHub's own action runtime is
        # glibc-linked and will not start in a musl container, and the upstream
        # firecracker release binary has the same problem.
        image:
          - debian:12
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed
    steps:
      - name: Bootstrap the container
        # Enough to run a bash script and check out the repo; the installer
        # takes it from there. Retries absorb transient mirror hiccups (seen
        # on fresh fedora:latest containers: dnf's metalink/zchunk repodata
        # fetch occasionally fails with a curl write error).
        run: |
          retry() {
            n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n + 1))
              echo "retrying ($n/5): $*" >&2
              sleep 5
            done
            return 1
          }

          if command -v apt-get >/dev/null; then
            retry apt-get update -qq && retry apt-get install -y -qq bash ca-certificates curl git
          elif command -v dnf >/dev/null; then
            retry dnf install -y -q bash ca-certificates curl git
          elif command -v pacman >/dev/null; then
            retry pacman -Sy --noconfirm --needed bash ca-certificates curl git
          elif command -v zypper >/dev/null; then
            # Tumbleweed's oss snapshot is replaced while the container
            # still has the previous repomd. A stale appdata-icons.tar.gz
            # hash then makes `zypper install git` fail even after retries
            # unless metadata is discarded first.
            retry sh -c 'zypper --non-interactive clean --all && zypper --non-interactive --gpg-auto-import-keys refresh --force && zypper --non-interactive install --no-recommends bash ca-certificates curl git'
          fi
        shell: sh -e {0}

      - uses: actions/checkout@v7

      - name: --check reports this distro's package manager
        run: ./install.sh --check

      - name: --deps-only installs them for real
        # Containers run as root, so no sudo. The installer no longer pulls
        # rustc or Node — those belong to --bin-dir / the release bundle.
        run: ./install.sh --deps-only

      - name: Everything the daemons need is present
        run: |
          for command in ip nft dnsmasq mkfs.ext4 firecracker sha256sum; do
            command -v "$command" >/dev/null || { echo "missing: $command"; exit 1; }
          done

  # M2 guest boot matrix: every supported guest template × every GitHub-hosted
  # Linux runner that exposes nested KVM (Ubuntu LTS family). Other host distros
  # get package deps in install-distro; full M2 boot there needs self-hosted KVM.
  vm-boot:
    name: M2 boot (${{ matrix.host }} / ${{ matrix.template }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with packaging/m2images.json and known_specs().
        template:
          - alpine-3.24.1
          - ubuntu-26.04
          - rocky-9.8
        # GitHub-hosted Linux images with nested KVM (x86_64).
        host:
          - ubuntu-24.04
          - ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.host }}-
            cargo-${{ runner.os }}-

      - name: Install pinned toolchain
        run: rustup show

      - name: KVM is available
        run: |
          test -e /dev/kvm || { echo "no /dev/kvm on ${{ matrix.host }}"; exit 1; }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          uname -a

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firecrab-frontend/package-lock.json

      - name: Build install payload
        run: ./scripts/ci-prepare-install-payload.sh

      - name: Install firecrab
        # install.sh intentionally leaves guest images to MicroRegistry or
        # MicroBoot; exercise the public MicroRegistry install path next.
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist

      - name: Install M2Image
        run: |
          chmod +x scripts/ci-install-m2image.sh
          scripts/ci-install-m2image.sh "${{ matrix.template }}"
          echo "BOOT_TEMPLATE=${{ matrix.template }}" >>"$GITHUB_ENV"

      - name: Images on disk
        run: |
          sudo ls -l /var/lib/firecrab/images/rootfs/ || true
          curl -fsS http://127.0.0.1:5523/api/images
          curl -fsS http://127.0.0.1:5523/api/vms

      - name: Boot M2 guest (create → start → ping → stop)
        run: |
          chmod +x scripts/ci-m2-guest-boot.sh
          scripts/ci-m2-guest-boot.sh "$BOOT_TEMPLATE"

      - name: Console log and journals (on failure)
        if: failure()
        run: |
          sudo find /var/lib/firecrab -name 'console.log' 2>/dev/null | head -5 | while read -r f; do
            echo "==== $f ===="; sudo tail -n 80 "$f" || true
          done
          sudo journalctl -u firecrab-api --no-pager -n 80 || true
          sudo journalctl -u firecrab-net-helper --no-pager -n 80 || true

  # Extra host OS / arch: only when the repo variable ENABLE_M2_SELF_HOSTED=true
  # and matching self-hosted runners are online. Without that gate, missing
  # runners would queue forever and stall nightly.
  vm-boot-self-hosted:
    name: M2 boot self-hosted (${{ matrix.host }} / ${{ matrix.template }})
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && vars.ENABLE_M2_SELF_HOSTED == 'true'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: debian-12
            template: alpine-3.24.1
            runner: '["self-hosted","linux","x64","kvm","debian-12"]'
          - host: debian-12
            template: ubuntu-26.04
            runner: '["self-hosted","linux","x64","kvm","debian-12"]'
          - host: debian-12
            template: rocky-9.8
            runner: '["self-hosted","linux","x64","kvm","debian-12"]'
          - host: fedora
            template: alpine-3.24.1
            runner: '["self-hosted","linux","x64","kvm","fedora"]'
          - host: fedora
            template: ubuntu-26.04
            runner: '["self-hosted","linux","x64","kvm","fedora"]'
          - host: fedora
            template: rocky-9.8
            runner: '["self-hosted","linux","x64","kvm","fedora"]'
          - host: archlinux
            template: alpine-3.24.1
            runner: '["self-hosted","linux","x64","kvm","arch"]'
          - host: archlinux
            template: ubuntu-26.04
            runner: '["self-hosted","linux","x64","kvm","arch"]'
          - host: archlinux
            template: rocky-9.8
            runner: '["self-hosted","linux","x64","kvm","arch"]'
          - host: opensuse
            template: alpine-3.24.1
            runner: '["self-hosted","linux","x64","kvm","opensuse"]'
          - host: opensuse
            template: ubuntu-26.04
            runner: '["self-hosted","linux","x64","kvm","opensuse"]'
          - host: opensuse
            template: rocky-9.8
            runner: '["self-hosted","linux","x64","kvm","opensuse"]'
          - host: aarch64
            template: alpine-3.24.1
            runner: '["self-hosted","linux","arm64","kvm"]'
    steps:
      - uses: actions/checkout@v7

      - name: Host and KVM
        run: |
          uname -a
          test -e /dev/kvm || { echo "no /dev/kvm on self-hosted ${{ matrix.host }}"; exit 1; }
          sudo chmod 666 /dev/kvm 2>/dev/null || chmod 666 /dev/kvm 2>/dev/null || true

      - name: Install pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firecrab-frontend/package-lock.json

      - name: Build install payload
        run: ./scripts/ci-prepare-install-payload.sh

      - name: Install firecrab
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" ./install.sh \
            --bin-dir target/release \
            --dashboard-dir firecrab-frontend/dist

      - name: Install M2Image
        run: |
          chmod +x scripts/ci-install-m2image.sh
          scripts/ci-install-m2image.sh "${{ matrix.template }}"
          echo "BOOT_TEMPLATE=${{ matrix.template }}" >>"$GITHUB_ENV"

      - name: Boot M2 guest
        run: |
          chmod +x scripts/ci-m2-guest-boot.sh
          scripts/ci-m2-guest-boot.sh "$BOOT_TEMPLATE"

      - name: Logs (on failure)
        if: failure()
        run: |
          sudo journalctl -u firecrab-api --no-pager -n 80 || true
          sudo journalctl -u firecrab-net-helper --no-pager -n 80 || true

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firecrab-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firecrab-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
