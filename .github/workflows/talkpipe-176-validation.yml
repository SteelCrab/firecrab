name: TalkPipe #176 adversarial validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  talkpipe-and-alpine:
    if: github.event.pull_request.head.ref == 'validation/176-m2image-license-source-bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/176-m2image-license-source-bundle

      - name: Apply Alpine SPDX corpus candidate
        run: |
          python3 .github/validation/add-alpine-spdx-license-texts.py
          grep -q 'spdx-licenses-text' scripts/firecracker-menual/install-alpine-rootfs.sh
          git diff --check

      - name: TalkPipe adversary in python:3.12-slim
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-slim \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends git ca-certificates >/dev/null
              git clone -q https://github.com/sandialabs/talkpipe.git /tmp/talkpipe
              git -C /tmp/talkpipe checkout -q 0ceb36bc1ab31df227c52a5eab990b61abd050bc
              test "$(git -C /tmp/talkpipe rev-parse HEAD)" = 0ceb36bc1ab31df227c52a5eab990b61abd050bc
              pip install --no-cache-dir -q \
                "pydantic>=2.4.0" "numpy>=1.22.2" networkx "prompt_toolkit>=3.0.13" greenlet
              PYTHONPATH=/tmp/talkpipe/src python3 .github/validation/talkpipe-176.py
            '

      - name: Install real-image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs file gzip tar curl zstd xz-utils jq

      - name: Build real Alpine candidate
        env:
          ZSTD_LEVEL: '1'
          ZSTD_THREADS: '2'
        run: scripts/build-m2images.sh --alias alpine-3.24.1 --arch x86_64

      - name: Require real Alpine legal corpus and provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('images/compliance/alpine-3.24.1-x86_64')
          bundle = json.loads((root / 'bundle.json').read_text())
          source_map = json.loads((root / 'source-map.json').read_text())
          license_index = json.loads((root / 'licenses/index.json').read_text())
          sbom = json.loads((root / 'sbom.spdx.json').read_text())

          assert bundle['packageCount'] >= 67, bundle
          assert bundle['guestLegalFileCount'] >= 100, bundle
          assert bundle['licenseFileCount'] > bundle['guestLegalFileCount'], bundle
          assert any(
              item.get('guestPath', '').startswith('/usr/share/spdx/text/')
              for item in license_index['files']
              if item.get('guestPath')
          ), 'SPDX text corpus not recovered from real ext4 image'
          assert any(p.get('name') == 'spdx-licenses-text' for p in sbom['packages']), \
              'spdx-licenses-text missing from installed-package SBOM'
          by_name = {p['binaryPackage']: p for p in source_map['packages']}
          assert 'busybox' in by_name
          assert by_name['busybox']['source'].get('repositoryCommit')
          assert 'spdx-licenses-text' in by_name
          assert by_name['spdx-licenses-text']['source']['sourcePackage'] == 'spdx-licenses'
          print(
              'real Alpine compliance:',
              f"packages={bundle['packageCount']}",
              f"guest_legal={bundle['guestLegalFileCount']}",
              f"license_files={bundle['licenseFileCount']}",
          )
          PY

      - name: Verify packaged archive keeps complete bundle
        run: |
          archive=dist/m2images/x86_64/alpine-3.24.1.tar.zst
          zstd -dc "$archive" | tar -tf - > members.txt
          grep -qx 'compliance/bundle.json' members.txt
          grep -qx 'compliance/source-map.json' members.txt
          grep -qx 'compliance/sbom.spdx.json' members.txt
          grep -qx 'compliance/licenses/index.json' members.txt
          grep -q '^compliance/licenses/guest/usr/share/spdx/text/' members.txt
