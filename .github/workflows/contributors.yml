name: Contributors

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, deleted, transferred]
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - .github/workflows/contributors.yml
      - scripts/update-contributors.py
      - README.md
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'SteelCrab/firecrab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      # Only trusted default-branch code runs, including for fork PR events.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README credits
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Rebuild against the latest README if another push wins the race.
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            git checkout --detach FETCH_HEAD
            python3 scripts/update-contributors.py --repository "$GITHUB_REPOSITORY"
            if git diff --quiet -- README.md; then
              echo 'Contributor credits are current.'
              exit 0
            fi
            git add -- README.md
            git commit -m 'docs: update PR and issue contributors'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "::warning::Contributor push attempt $attempt failed; retrying from the default branch."
          done
          echo '::error::Could not publish contributor credits. Rerun this workflow after resolving the push failure.'
          exit 1
