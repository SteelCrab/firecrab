name: Set up dashboard Rust tools
description: Install the pinned Rust toolchain, browser target, and wasm-pack.
runs:
  using: composite
  steps:
    - name: Install browser target
      shell: bash
      working-directory: ${{ github.workspace }}
      run: rustup target add wasm32-unknown-unknown
    - name: Cache wasm-pack
      id: wasm-pack
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/wasm-pack
        key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0
    - name: Install wasm-pack
      if: steps.wasm-pack.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: cargo install wasm-pack --version 0.14.0 --locked
