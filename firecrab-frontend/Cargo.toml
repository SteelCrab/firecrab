[package]
name = "firecrab-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
description = "Rust WebAssembly dashboard for Firecrab"
repository = "https://github.com/SteelCrab/firecrab"

# Keep the browser client independent of native-only workspace dependencies.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
js-sys = "=0.3.103"
web-sys = { version = "=0.3.103", features = [
  "File", "FileList", "Crypto", "Window", "Document", "Element", "Node", "NodeList", "Event", "EventTarget",
  "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
  "HtmlFormElement", "FocusOptions", "FormData", "Location", "History", "Storage", "KeyboardEvent",
  "Request", "RequestInit", "Headers", "Response", "AbortController", "AbortSignal",
  "Performance", "console", "HashChangeEvent", "Navigator", "Clipboard", "PointerEvent", "DomRect", "WebSocket", "BinaryType", "CloseEvent", "MessageEvent", "CustomEvent", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"
] }

[dev-dependencies]
firecrab-api-types = { path = "../firecrab-api-types" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
