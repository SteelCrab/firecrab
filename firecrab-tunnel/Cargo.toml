[package]
name = "firecrab-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
firecrab-helper-protocol = { path = "../firecrab-helper-protocol" }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "form", "stream"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
