<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" data-theme="light" style="background:#FFFFFF" viewBox="0 0 1200 640" role="img" aria-label="VM lifetime: the network helper runs each VM's firecrab-vm shim in its own systemd unit, so the VM survives API restarts and is re-attached over shim.sock; a stop from outside the API is recorded as stopped. At startup the API re-adopts running VMs, finishes interrupted stops, kills interrupted starts as errors, and settles the rest from exit.json."><style><![CDATA[
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #17212B;
  --muted: #56636F;
  --line: #C3CDD7;
  --host-bg: #E8EDF2;
  --host-line: #B2BFCB;
  --vm-bg: #DBE8F8;
  --vm-line: #3A6EB5;
  --fc-bg: #FCE5D2;
  --fc-line: #C8611F;
  --warn: #B42318;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root {
  --c-client: #232F3E; --c-control: #3B48CC; --c-compute: #ED7100; --c-storage: #6B8E12;
  --c-network: #8C4FFF; --c-manager: #0B8F7A; --badge-bg: #232F3E; --badge-fg: #FFFFFF; --c-macos: #1D1D1F; --c-linux: #FFFFFF; --c-linux-line: #AEB9C4;
}
:root { --c-security: #DD344C; }
svg .h { font-size: 17px; font-weight: 600; }
svg .t { font-size: 13px; font-weight: 600; }
svg .tm, svg .hm { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
svg .hm { font-size: 15px; font-weight: 500; }
svg .tn { font-size: 13px; font-weight: 600; fill: var(--muted); }
svg .s { font-size: 12px; fill: var(--muted); }
svg .sm { font-family: var(--font-mono); font-size: 11.5px; fill: var(--muted); }
svg .w { font-size: 12px; font-weight: 500; fill: var(--warn); }
svg .a { font-size: 12px; fill: var(--ink); }
svg .lbl { font-size: 12px; fill: var(--muted); }
svg rect { stroke-width: 1.2; }
svg .host { fill: var(--host-bg); stroke: var(--host-line); }
svg .vm { fill: var(--vm-bg); stroke: var(--vm-line); }
svg .fc { fill: var(--fc-bg); stroke: var(--fc-line); }
svg .chip { fill: var(--surface); stroke: var(--line); }
svg .inner { fill: var(--host-bg); stroke: var(--host-line); }
svg .stack { fill: var(--surface); stroke: var(--line); }
svg .apibox { fill: var(--host-bg); stroke: var(--ink); stroke-width: 1.5; }
svg .priv { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
svg .none { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
svg .warnbox { fill: var(--surface); stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.4; }
svg .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .mk { fill: var(--ink); }
svg .tile { stroke: none; }
svg .c-client { fill: var(--c-client); }
svg .c-control { fill: var(--c-control); }
svg .c-compute { fill: var(--c-compute); }
svg .c-storage { fill: var(--c-storage); }
svg .c-network { fill: var(--c-network); }
svg .c-manager { fill: var(--c-manager); }
svg .c-linux { fill: var(--c-linux); stroke: var(--c-linux-line); stroke-width: 1.2; }
svg .c-macos { fill: var(--c-macos); }
svg .c-windows { fill: #0078D4; }
svg .lg-dark { fill: #111111; }
svg .lg-white { fill: #FFFFFF; }
svg .lg-red { fill: #A81D33; stroke: #A81D33; stroke-width: 0.6; stroke-linejoin: round; }
svg .dring { fill: var(--surface); stroke: none; }
svg .dbadge { fill: #FFFFFF; stroke: #D5DCE3; stroke-width: 1; }
svg .gl { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .gl .gf { fill: #FFFFFF; stroke: none; }
svg .gl .gb { fill: var(--c-control); }
svg .g-solid { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .g-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
svg .g-comp { stroke: var(--c-compute); }
svg .g-ctrl { stroke: var(--c-control); }
svg .rule { stroke: var(--line); stroke-width: 1; fill: none; }
svg .tl { font-size: 13px; font-weight: 500; }
svg .ts { font-size: 12px; fill: var(--muted); }
svg .gt { font-size: 14px; font-weight: 600; }
svg .gs { font-size: 12px; fill: var(--muted); }
svg .colh { font-size: 12px; fill: var(--muted); letter-spacing: 0.06em; }
svg .badge { fill: var(--badge-bg); stroke: none; }
svg .badget { font-size: 12px; font-weight: 600; fill: var(--badge-fg); }
svg .cmd { font-family: var(--font-mono); font-size: 12px; }
svg .warnpill { fill: var(--surface); stroke: var(--warn); stroke-width: 1.4; }
svg .pillt { font-size: 12px; font-weight: 500; fill: var(--warn); }
svg .c-security { fill: var(--c-security); }
svg .c-white { fill: var(--c-linux); stroke: var(--c-linux-line); stroke-width: 1.2; }
svg .dashed { stroke-dasharray: 5 4; }
svg .g-mgr { stroke: var(--c-manager); }
svg .g-state { stroke: var(--c-storage); }
svg .g-net { stroke: var(--c-network); }
svg .g-sec { fill: none; stroke: var(--c-security); stroke-width: 2; }
]]></style><defs><marker id="arw-v-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"></path></marker></defs><rect x="30" y="30" width="1140" height="270" rx="6" class="g-dash g-comp"></rect><text x="42" y="52" class="gt" text-anchor="start">Every VM runs in its own systemd unit</text><rect x="50" y="70" width="160" height="150" rx="6" class="none"></rect><text x="60" y="90" class="sm" text-anchor="start">firecrab-api.service</text><rect x="102" y="112" width="56" height="56" rx="6" class="tile c-control"></rect><g transform="translate(130 140) scale(1.2000) translate(-12 -12)" class="gl" style="stroke-width:1.67px"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" x2="6.01" y1="6" y2="6"></line><line x1="6" x2="6.01" y1="18" y2="18"></line></g><text x="130" y="186" class="tl" text-anchor="middle">firecrab-api</text><text x="130" y="203" class="ts" text-anchor="middle">unprivileged</text><rect x="247" y="112" width="56" height="56" rx="6" class="tile c-security"></rect><g transform="translate(275 140) scale(1.2000) translate(-12 -12)" class="gl" style="stroke-width:1.67px"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></g><text x="275" y="186" class="tl" text-anchor="middle">net-helper</text><text x="275" y="203" class="ts" text-anchor="middle">StartVmUnit</text><rect x="340" y="70" width="230" height="150" rx="6" class="none"></rect><text x="350" y="90" class="sm" text-anchor="start">firecrab-vm-&lt;id&gt;.service</text><rect x="370" y="112" width="56" height="56" rx="6" class="tile c-compute"></rect><g transform="translate(398 140) scale(1.2000) translate(-12 -12)" class="gl" style="stroke-width:1.67px"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"></path><path d="M10 21.9V14L2.1 9.1"></path><path d="m10 14 11.9-6.9"></path><path d="M14 19.8v-8.1"></path><path d="M18 17.5V9.4"></path></g><text x="398" y="186" class="tl" text-anchor="middle">firecrab-vm</text><text x="398" y="203" class="ts" text-anchor="middle">API user</text><rect x="480" y="112" width="56" height="56" rx="6" class="tile c-compute"></rect><g transform="translate(508 140) scale(1.2000) translate(-12 -12)" class="gl" style="stroke-width:1.67px"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></g><text x="508" y="186" class="tl" text-anchor="middle">Firecracker</text><text x="508" y="203" class="ts" text-anchor="middle">child of the shim</text><path d="M158 140 H247" class="edge" marker-end="url(#arw-v-en)"></path><path d="M303 140 H370" class="edge" marker-end="url(#arw-v-en)"></path><text x="320" y="130" class="a" text-anchor="middle">run</text><path d="M426 140 H480" class="edge" marker-end="url(#arw-v-en)"></path><path d="M130 220 V240 H398 V220" class="edge dashed" marker-start="url(#arw-v-en)" marker-end="url(#arw-v-en)"></path><text x="264" y="256" class="a" text-anchor="middle">shim.sock · console, stop, exit</text><text x="610" y="100" class="tl" text-anchor="start">API restart or upgrade</text><text x="610" y="118" class="ts" text-anchor="start">the VM keeps running in its unit; startup re-attaches over shim.sock</text><text x="610" y="152" class="tl" text-anchor="start">systemctl stop of the unit, host shutdown</text><text x="610" y="170" class="ts" text-anchor="start">the shim stops its VM and records stop_requested → stopped</text><text x="610" y="204" class="tl" text-anchor="start">Shim or Firecracker killed</text><text x="610" y="222" class="ts" text-anchor="start">the unit ends with them; the exit (or its absence) → error</text><text x="610" y="256" class="tl" text-anchor="start">Start right after a stop</text><text x="610" y="274" class="ts" text-anchor="start">the helper clears the previous unit of the same name first</text><rect x="30" y="330" width="1140" height="280" rx="6" class="g-dash g-ctrl"></rect><text x="42" y="352" class="gt" text-anchor="start">API startup: settle every VM the database calls active</text><rect x="50" y="420" width="170" height="44" rx="6" class="chip"></rect><text x="135" y="439" class="tl" text-anchor="middle">Active record</text><text x="135" y="456" class="ts" text-anchor="middle">starting · running · stopping</text><path d="M220 442 H250" class="edge" marker-end="url(#arw-v-en)"></path><rect x="250" y="420" width="150" height="44" rx="6" class="chip"></rect><text x="325" y="439" class="tl" text-anchor="middle">Shim answers?</text><text x="325" y="456" class="ts" text-anchor="middle">on shim.sock</text><path d="M325 420 V385 H440" class="edge" marker-end="url(#arw-v-en)"></path><text x="410" y="378" class="a" text-anchor="middle">yes</text><rect x="440" y="365" width="160" height="40" rx="6" class="chip"></rect><text x="520.0" y="389.5" class="a" text-anchor="middle">running → re-adopt</text><rect x="612" y="365" width="230" height="40" rx="6" class="chip"></rect><text x="727.0" y="389.5" class="a" text-anchor="middle">stopping → re-adopt, finish the stop</text><rect x="854" y="365" width="190" height="40" rx="6" class="warnbox"></rect><text x="949.0" y="389.5" class="w" text-anchor="middle">starting → kill → error</text><path d="M325 464 V505 H440" class="edge" marker-end="url(#arw-v-en)"></path><text x="410" y="498" class="a" text-anchor="middle">no</text><rect x="440" y="485" width="110" height="40" rx="6" class="chip"></rect><text x="495" y="509.5" class="tl" text-anchor="middle">exit.json</text><path d="M550 505 H566" class="edge" marker-end="url(#arw-v-en)"></path><rect x="566" y="485" width="210" height="40" rx="6" class="chip"></rect><text x="671.0" y="509.5" class="a" text-anchor="middle">clean or requested → stopped</text><rect x="788" y="485" width="130" height="40" rx="6" class="warnbox"></rect><text x="853.0" y="509.5" class="w" text-anchor="middle">crash → error</text><rect x="930" y="485" width="190" height="40" rx="6" class="chip"></rect><text x="1025.0" y="509.5" class="a" text-anchor="middle">missing → stopped</text><text x="50" y="566" class="a" text-anchor="start">Every VM not re-adopted has its unit stopped and loses its TAP and firewall policy; networks, policies, and re-adopted TAPs are then re-applied.</text><text x="50" y="588" class="ts" text-anchor="start">A shim that answers but cannot be attached (another protocol version) is stopped through the helper; units with no re-adopted VM are only logged.</text></svg>
