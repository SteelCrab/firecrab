<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" data-theme="light" style="background:#FFFFFF" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">macOS source development</title>
<desc id="desc">The Mac uploads a checkout snapshot over SSH. Debian builds Linux ARM64 executables, stages them, and switches systemd to the source-built API and net-helper. Vite proxies browser API and WebSocket requests through the Mac API tunnel.</desc>
<style><![CDATA[
:root {
