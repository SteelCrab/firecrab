<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" data-theme="light" style="background:#FFFFFF" viewBox="0 0 1200 540" role="img" aria-label="Four steps: a user asks Firecrab on their own server from a browser or the CLI; Firecrab prepares an M2Image, MicroNetwork, and MicroStorage, starts a MicroVM, and receives the guest's ready signal."><style><![CDATA[
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #17212B;
  --muted: #56636F;
  --line: #C3CDD7;
  --host-bg: #E8EDF2;
  --host-line: #B2BFCB;
  --vm-bg: #DBE8F8;
  --vm-line: #3A6EB5;
  --fc-bg: #FCE5D2;
  --fc-line: #C8611F;
  --warn: #B42318;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root {
  --c-client: #232F3E; --c-control: #3B48CC; --c-compute: #ED7100; --c-storage: #6B8E12;
  --c-network: #8C4FFF; --c-manager: #0B8F7A; --badge-bg: #232F3E; --badge-fg: #FFFFFF; --c-macos: #1D1D1F; --c-linux: #FFFFFF; --c-linux-line: #AEB9C4;
}
svg text { font-family: var(--font-body); fill: var(--ink); }
svg .h { font-size: 17px; font-weight: 600; }
svg .t { font-size: 13px; font-weight: 600; }
svg .tm, svg .hm { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
svg .hm { font-size: 15px; font-weight: 500; }
svg .tn { font-size: 13px; font-weight: 600; fill: var(--muted); }
svg .s { font-size: 12px; fill: var(--muted); }
svg .sm { font-family: var(--font-mono); font-size: 11.5px; fill: var(--muted); }
svg .w { font-size: 12px; font-weight: 500; fill: var(--warn); }
svg .a { font-size: 12px; fill: var(--ink); }
svg .lbl { font-size: 12px; fill: var(--muted); }
svg rect { stroke-width: 1.2; }
svg .host { fill: var(--host-bg); stroke: var(--host-line); }
svg .vm { fill: var(--vm-bg); stroke: var(--vm-line); }
svg .fc { fill: var(--fc-bg); stroke: var(--fc-line); }
svg .chip { fill: var(--surface); stroke: var(--line); }
svg .inner { fill: var(--host-bg); stroke: var(--host-line); }
svg .stack { fill: var(--surface); stroke: var(--line); }
svg .apibox { fill: var(--host-bg); stroke: var(--ink); stroke-width: 1.5; }
svg .priv { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
svg .none { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
svg .warnbox { fill: var(--surface); stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.4; }
svg .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .mk { fill: var(--ink); }
svg .tile { stroke: none; }
svg .c-client { fill: var(--c-client); }
svg .c-control { fill: var(--c-control); }
svg .c-compute { fill: var(--c-compute); }
svg .c-storage { fill: var(--c-storage); }
svg .c-network { fill: var(--c-network); }
svg .c-manager { fill: var(--c-manager); }
svg .c-linux { fill: var(--c-linux); stroke: var(--c-linux-line); stroke-width: 1.2; }
svg .c-macos { fill: var(--c-macos); }
svg .c-windows { fill: #0078D4; }
svg .lg-dark { fill: #111111; }
svg .lg-white { fill: #FFFFFF; }
svg .lg-red { fill: #A81D33; stroke: #A81D33; stroke-width: 0.6; stroke-linejoin: round; }
svg .dring { fill: var(--surface); stroke: none; }
svg .dbadge { fill: #FFFFFF; stroke: #D5DCE3; stroke-width: 1; }
svg .gl { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .gl .gf { fill: #FFFFFF; stroke: none; }
svg .gl .gb { fill: var(--c-control); }
svg .g-solid { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .g-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
svg .g-comp { stroke: var(--c-compute); }
svg .g-ctrl { stroke: var(--c-control); }
svg .rule { stroke: var(--line); stroke-width: 1; fill: none; }
svg .tl { font-size: 13px; font-weight: 500; }
svg .ts { font-size: 12px; fill: var(--muted); }
svg .gt { font-size: 14px; font-weight: 600; }
svg .gs { font-size: 12px; fill: var(--muted); }
svg .colh { font-size: 12px; fill: var(--muted); letter-spacing: 0.06em; }
svg .badge { fill: var(--badge-bg); stroke: none; }
svg .badget { font-size: 12px; font-weight: 600; fill: var(--badge-fg); }
svg .cmd { font-family: var(--font-mono); font-size: 12px; }
svg .warnpill { fill: var(--surface); stroke: var(--warn); stroke-width: 1.4; }
svg .pillt { font-size: 12px; font-weight: 500; fill: var(--warn); }
