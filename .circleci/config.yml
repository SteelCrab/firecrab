version: 2.1

jobs:
  micromanager-macos:
    # M4 is intentional: microManager requires Apple silicon with nested
    # virtualization. The doctor gate fails before installation if CircleCI's
    # macOS VM does not expose that host capability.
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout

      - run:
          name: Configure isolated microManager paths
          command: |
            ci_root="${TMPDIR%/}/firecrab-${CIRCLE_WORKFLOW_ID}"
            printf 'export FIRECRAB_INSTALL_DIR=%q\n' "$ci_root/bin" >> "$BASH_ENV"
            printf 'export FIRECRAB_MICROMANAGER_HOME=%q\n' "$ci_root/micromanager" >> "$BASH_ENV"
            printf 'export FIRECRAB_MICROMANAGER_HELPER=%q\n' \
              "$CIRCLE_WORKING_DIRECTORY/target/debug/firecrab-micromanager-macos" >> "$BASH_ENV"

      - run:
          name: Install pinned Rust toolchain
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal
              printf 'export PATH=%q:$PATH\n' "$HOME/.cargo/bin" >> "$BASH_ENV"
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            rustup show

      - run:
          name: Swift unit tests
          command: >-
            swift test --package-path micromanager-macos
            --scratch-path target/swift-micromanager-tests

      - run:
          name: Build signed helper and CLI
          command: |
            scripts/build-micromanager-macos.sh target/debug/firecrab-micromanager-macos
            codesign --verify --strict target/debug/firecrab-micromanager-macos
            codesign -d --entitlements :- target/debug/firecrab-micromanager-macos 2>&1 \
              | grep -q com.apple.security.virtualization
            cargo build -p firecrab-cli --locked

      - run:
          name: macOS CLI clippy and tests
          command: |
            cargo clippy -p firecrab-cli --all-targets -- -D warnings
            cargo test -p firecrab-cli --locked
            target/debug/firecrab --help
            target/debug/firecrab host list

      - run:
          name: G2 capability, fresh install, and service status
          no_output_timeout: 30m
          command: scripts/ci-qa-macos-e2e.sh gate

      - run:
          name: Shared API QA
          command: scripts/ci-qa-macos-e2e.sh api

      - run:
          name: nginx workload E2E
          no_output_timeout: 30m
          command: scripts/ci-qa-macos-e2e.sh nginx

      - run:
          name: OCI guest lifecycle E2E
          no_output_timeout: 60m
          command: scripts/ci-qa-macos-e2e.sh guest

      - run:
          name: Purge isolated microManager state
          when: always
          command: |
            if [ -x target/debug/firecrab ]; then
              target/debug/firecrab service uninstall --purge
            fi

workflows:
  micromanager:
    jobs:
      - micromanager-macos
