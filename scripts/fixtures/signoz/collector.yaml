receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    use_new_schema: true
    sending_queue:
      enabled: false
  metadataexporter:
    dsn: tcp://clickhouse:9000/signoz_metadata
    enabled: true
    cache:
      provider: in_memory
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouselogsexporter, metadataexporter]
