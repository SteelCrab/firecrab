# Disposable acceptance fixture only. All exposed ports bind to loopback.
services:
  keeper:
    image: clickhouse/clickhouse-keeper@sha256:525b8b0f93ccb371131c46f22a066ea43d33d74aba314203e8044609945d8524
    entrypoint: [/usr/bin/clickhouse-keeper, --config-file=/etc/clickhouse-keeper/keeper.yaml]
    volumes:
      - ./keeper.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
      - keeper:/var/lib/clickhouse-keeper
    healthcheck:
      test: [CMD, clickhouse-keeper-client, -h, localhost, -p, "9181", -q, ls]
      interval: 2s
      timeout: 5s
      retries: 60
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/clickhouse.yaml
    volumes:
      - ./clickhouse.yaml:/etc/clickhouse-server/clickhouse.yaml:ro
      - clickhouse:/var/lib/clickhouse
    ports: ["127.0.0.1:25876:8123"]
    depends_on:
      keeper: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_DB: signoz
      POSTGRES_USER: signoz
      POSTGRES_PASSWORD: disposable-signoz-qa
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD, pg_isready, -U, signoz, -d, signoz]
      interval: 2s
      timeout: 5s
      retries: 60
  migrator:
    image: &collector_image signoz/signoz-otel-collector@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
    entrypoint: [/bin/sh, -ec]
    command:
      - /signoz-otel-collector migrate ready && /signoz-otel-collector migrate bootstrap && /signoz-otel-collector migrate sync up && /signoz-otel-collector migrate async up
    environment: &collector_environment
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 5m
    depends_on:
      clickhouse: {condition: service_healthy}
  collector:
    image: *collector_image
    entrypoint: [/signoz-otel-collector]
    command: [--config=/etc/otel-collector-config.yaml]
    environment: *collector_environment
    volumes: ["./collector.yaml:/etc/otel-collector-config.yaml:ro"]
    ports: ["127.0.0.1:25878:4318"]
    depends_on:
      migrator: {condition: service_completed_successfully}
  signoz:
    image: signoz/signoz@sha256:a7d1a968a1f7f65c518106150ac05424ca8e91c52d7076077dfce034980e9c34
    environment:
      SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://signoz:disposable-signoz-qa@postgres:5432/signoz?sslmode=disable
      SIGNOZ_SQLSTORE_PROVIDER: postgres
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
    ports: ["127.0.0.1:25879:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      migrator: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8080/api/v1/health]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  keeper:
  clickhouse:
  postgres:
