[package]
name = "firecrab-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-compression = { version = "0.4.43", features = ["gzip", "tokio", "zstd"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = { workspace = true }
firecrab-api-types = { path = "../firecrab-api-types" }
firecrab-helper-protocol = { path = "../firecrab-helper-protocol" }
filetime = "0.2.29"
futures-util = "0.3"
libc = "0.2.186"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { version = "0.4.46", default-features = false }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
# `test-util` (tokio's paused-clock support) is dev-only on purpose: it lets
# tests drive minute-scale waits — the bootstrap console probe's retry budget
# and its progress heartbeat — in virtual time against the real production
# constants, without leaking a test-only clock into the shipped binary.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
