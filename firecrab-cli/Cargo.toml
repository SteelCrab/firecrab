[package]
name = "firecrab-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "firecrab"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
firecrab-api-types = { path = "../firecrab-api-types" }
firecrab-helper-protocol = { path = "../firecrab-helper-protocol" }
firecrab-stack = { path = "../firecrab-stack" }
fs2 = "0.4.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "form", "blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.27.0"
thiserror = { workspace = true }
toml = "1.1.8"
# Helper framing and the VM console are async-only, so their paths use
# current-thread runtimes. doctor/info/status stay fully synchronous.
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "io-std", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { workspace = true, features = ["v4"] }
reflink-copy = "0.1.30"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["user"] }

[dev-dependencies]
socket2 = "0.6.5"
tower = { version = "0.5.3", features = ["util"] }
